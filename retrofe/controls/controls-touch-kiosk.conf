# ArcadeMaster - touchscreen kiosk (vertical game list)
# drag = scroll (held, accelerates) | flick = page | tap = select | long press = random | two-finger tap = back
up = Up, touchDragDown, mouseWheelUp
down = Down, touchDragUp, mouseWheelDown
left = Left, touchSwipeRight
right = Right, touchSwipeLeft
pageUp = PageUp, touchSwipeDown
pageDown = PageDown, touchSwipeUp
select = Return, touchTap
back = Escape, touchTwoFingerTap
random = R, touchLongPress
quit = Q
deadZone = 30
# tuning (fractions of screen / milliseconds)
touchDragDeadzone = 0.05
touchSwipeMinDistance = 0.12
touchLongPressMs = 650
