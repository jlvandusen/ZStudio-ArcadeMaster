# ArcadeMaster - lightgun stand-up (Sinden / Gun4IR / AimTrak in mouse mode)
# trigger = select, offscreen reload / right button = back, pedal (often a key) = scroll down
# Navigation is easiest on a small button panel or the gun's D-pad (mapped as keys or joystick).
up = Up, joyHat0Up
down = Down, joyHat0Down, Space
left = Left, joyHat0Left
right = Right, joyHat0Right
select = Return, mouseButtonLeft
back = Escape, mouseButtonRight
random = R, mouseButtonMiddle
quit = Q
deadZone = 30
