# ArcadeMaster - trackball / spinner panel (both appear to Windows as a mouse)
# trackball Y (or spinner) scrolls: a nudge = one item, a spin = fast scroll; buttons are panel buttons/keys
up = Up, trackballUp, mouseWheelUp
down = Down, trackballDown, mouseWheelDown
left = Left, spinnerLeft
right = Right, spinnerRight
select = Return, 1, mouseButtonLeft
back = Escape, mouseButtonRight
random = R
quit = Q
deadZone = 30
# raise for high-resolution trackballs (counts per list step)
mouseAxisStep = 30
