# ArcadeMaster - 4-player pedestal with a second (touch) screen
# Panel: keyboard encoder (Ultimarc I-PAC default layout: P1 = arrows + LCtrl/LAlt/Space, 1P start = 1, 2P start = 2)
# Second screen = RetroFE screen 1 (tools\Set-RetroFEScreens.ps1) showing the touch bar:
#   BACK | PREV | START | NEXT | RANDOM  = touch1Column1..5of5Row3of3 (bottom third of the pedestal screen)
# Swipes / drag on the pedestal screen also browse; touches on the main screen are ignored by touch1... tokens.
up = Up, joyHat0Up, joyAxis1-, touch1Column2of5Row3of3, touch1SwipeDown, touch1DragDown
down = Down, joyHat0Down, joyAxis1+, touch1Column4of5Row3of3, touch1SwipeUp, touch1DragUp
left = Left, joyHat0Left, joyAxis0-
right = Right, joyHat0Right, joyAxis0+
# PAGE DOWN shows the game's info over the video, PAGE UP goes back to the video (James 2026-11-26; RetroFE patch
# 0019; the layout floats a hint chip for each). They no longer jump the list a page - letterUp / letterDown still do.
showGameInfo = PageDown
hideGameInfo = PageUp
# letters: P1 button 5 (Z) = back a letter, P1 button 8 (T) = forward a letter - the lower row, both ends (James
# 2026-11-26); the layout floats a "5 <- A-Z -> 8" hint at the foot of the list
letterUp = Z
letterDown = T
select = Return, LCtrl, 1, 2, 3, 4, joyButton0, touch1Column3of5Row3of3
back = Escape, LAlt, joyButton1, touch1Column1of5Row3of3, touch1TwoFingerTap
random = R, Space, touch1Column5of5Row3of3, touch1LongPress
# quit = a key on no panel: RetroFE treats each quit key as a one-press kill of the running game, and Q is P2 button 3
# here. The in-game exit is quitCombo: P1 Start + P1 Coin pressed together.
quit = F8
quitCombo = 1, 5
deadZone = 30
