# ArcadeMaster - racing cabinet (Logitech G29). Mirrors the controls that already work on DESKTOP-RACE1
# (E:\DRIVE Collection\controls.conf) plus mouse-wheel scrolling. Verify axis/button numbers on a new
# cabinet with: tools\wheelmap\WheelMap.ps1 -Detect
up = Up, joyHat0Up, joyAxis1-, joyAxis2+, mouseWheelUp
down = Down, joyHat0Down, joyAxis1+, joyAxis5+, mouseWheelDown
left = Left, joyHat0Left, joyAxis0-
right = Right, joyHat0Right, joyAxis0+
letterUp = M, joyButton5
letterDown = N, joyButton4
random = R, joyButton6
select = Return, 1, joyButton0, joyButton7
back = Escape, Backspace, joyButton1
quit = Q
deadZone = 30
