# ArcadeMaster frontend (our RetroFE fork, github.com/jlvandusen/ZStudio-retrofe). Made by tools/New-FrontendSkeleton.py
# from release/frontend-template/settings.conf; {ROOT} is the ArcadeMaster install folder. Set up this PC (AmPanel)
# fills the game lists; tools/Set-RetroFEScreens.ps1 sets a second screen.
numScreens = 1
fullscreen0 = no
horizontal0 = stretch
vertical0 = stretch
screenNum0 = 0
layout = ArcadeMaster
hideMouse = yes
showParenthesis = yes
showSquareBrackets = yes
lastplayedSize = 10
firstCollection = Main
firstPlaylist = all
videoEnable = yes
videoLoop = 0
attractModeTime = 20
attractModeNextTime = 20
attractModeMinTime = 500
attractModeMaxTime = 1900
rememberMenu = yes
collectionInputClear = yes
playlistInputClear = yes
cabinetType = auto
cabinetFollowHardware = yes
cabinetShowAllModes = no
enterOnCollection = no
log = ERROR,WARNING,INFO
LEDBlinkyDirectory = {ROOT}\ampanel-shim
LEDBlinkyCloseOnExit = no
arcadeMasterPanel = {ROOT}\AmPanel.exe
linkEvents = no
musicPlayer.enabled = no
