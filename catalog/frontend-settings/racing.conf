# Frontend settings for a racing cabinet, on top of common.conf (docs/21 phase 3). A key a cabinet's own
# settings.conf has is left out for that cabinet. Add a key here when every racing cabinet should have it.

# attract mode after 90 s without a press. The cabinet link rejoins only once a cabinet is in attract mode, so
# this is also how long a used cabinet stays out of the link (James 2026-11-27: "90 s on both"; RACE2 had 20 s
# and rejoined 35 s after a press)
attractModeTime = 90

# the menu's own force feedback on the wheel (spring, centre at 50 %), as RACE1 runs it; James 2026-11-28: the two rigs
# the same, RACE1's behaviour as the reference (tools/Compare-Cabinets.ps1)
ffb = yes
ffbCenter = 50
ffbDevice = G29
ffbTick = 0
# video: hardware decoding of the menu videos and the Direct3D 11 renderer, as on RACE1
HardwareVideoAccel = true
SDLRenderDriver = direct3d11
metaLock = true
